# ATLAS on Render with its own Postgres database (live business data).
# Deploying this creates a paid database (plan 0.1c-256mb, US$6/month) and an always-on web
# service. You'll be asked for the owner email and password during setup.
# After the first deploy: sign in, open Settings > Backup and import, and
# import your Airtable export file.
services:
  - type: web
    name: atlas
    runtime: node
    rootDir: atlas
    plan: starter         # always on (US$7/month); the free plan sleeps after 15 idle minutes
    region: singapore     # closest Render region to Sydney
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ATLAS_DATA_SOURCE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString
      - key: ATLAS_SESSION_SECRET
        generateValue: true
      - key: ATLAS_OWNER_EMAIL
        sync: false
      - key: ATLAS_OWNER_PASSWORD
        sync: false

databases:
  - name: atlas-db
    plan: 0.1c-256mb      # paid; the free plan is deleted after 30 days and has no backups
    region: singapore
    databaseName: atlas
    user: atlas
    ipAllowList: []       # only the ATLAS web service can reach it
